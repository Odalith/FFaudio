name: CI

# Pushes to master, and pull requests: a branch with a pull request is tested once per push, as the pull request
# (pushing to every branch ran each commit twice, as a push and as the pull request). Any other branch: run it by
# hand (workflow_dispatch), or open a pull request.
on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request (or branch) cancels the run still going
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Version and real-time lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Version in CMakeLists.txt and lib/ffaudio.h agree
        run: |
          version=$(sed -n 's/^project(ffAudio VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          header=$(for p in MAJOR MINOR PATCH; do sed -n "s/^#define FFAUDIO_VERSION_$p \([0-9]*\).*/\1/p" lib/ffaudio.h; done | paste -sd.)
          [ "$header" = "$version" ] || { echo "::error::lib/ffaudio.h says $header, CMakeLists.txt says $version"; exit 1; }
      - name: Real-time rules (docs/threading.md)
        run: scripts/dev/rt_lint.sh

  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            build_type: RelWithDebInfo
            sanitizer: none
            chaos: OFF
            experimental: false
          - name: asan
            build_type: Debug
            sanitizer: address
            chaos: OFF
            experimental: false
          - name: tsan
            build_type: RelWithDebInfo
            sanitizer: thread
            chaos: OFF
            experimental: false
          - name: ubsan
            build_type: RelWithDebInfo
            sanitizer: address,undefined
            chaos: OFF
            experimental: false
          # Light random delays at the thread hand-offs (docs/threading.md, "Chaos testing") and the forced race
          # tests; not blocking until it has been green for a while
          - name: chaos
            build_type: RelWithDebInfo
            sanitizer: none
            chaos: ON
            experimental: true
    steps:
      - uses: actions/checkout@v4

      # ThreadSanitizer can not map its shadow memory with the runner's high mmap randomisation
      - name: Allow ThreadSanitizer
        if: matrix.sanitizer == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28

      # The Ubuntu mirror is sometimes very slow (~100 kB/s for the ~107 MB of packages, 15+ minutes),
      # so the downloaded .deb files are cached. The month in the key picks up package updates regularly.
      - name: Cache key
        id: apt-key
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-ubuntu-24.04-${{ steps.apt-key.outputs.month }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-ubuntu-24.04-${{ steps.apt-key.outputs.month }}-
            apt-ubuntu-24.04-

      # cmake and pkg-config come with the runner image
      - name: Install dependencies
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-cache" \
            ninja-build ffmpeg flac libsdl2-dev \
            libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev libswresample-dev
          # apt leaves root-owned files behind; the cache action needs to read them
          sudo rm -f ~/apt-cache/lock
          sudo chown -R "$USER" ~/apt-cache

      # The player's tests need Textual; the bindings' tests only Python, which the runner has
      - name: Textual for the player's tests
        if: matrix.name == 'release'
        run: |
          python3 -m venv ~/pyenv
          ~/pyenv/bin/pip install -q -r player/requirements.txt

      # The C# bindings' tests (bindings/csharp, CTest's csharp_bindings): not with a sanitizer, like the Python ones
      - uses: actions/setup-dotnet@v4
        if: matrix.sanitizer == 'none'
        with:
          dotnet-version: 8.0.x

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DFFAUDIO_SANITIZER=${{ matrix.sanitizer }}
          ${{ matrix.name == 'release' && '-DPython3_EXECUTABLE=/home/runner/pyenv/bin/python' || '' }}
          -DFFAUDIO_CHAOS=${{ matrix.chaos }}
          -DFFAUDIO_REQUIRE_TESTS=ON
          -DCMAKE_INSTALL_PREFIX=$PWD/stage

      - name: Build
        run: cmake --build build

      # A test that CMake leaves out because a tool is missing would pass by not running
      - name: The bindings' tests are there
        if: matrix.sanitizer == 'none'
        run: |
          ctest --test-dir build -N | grep -q csharp_bindings || { echo "::error::csharp_bindings is not registered (no .NET SDK found)"; exit 1; }
          ctest --test-dir build -N | grep -q python_bindings || { echo "::error::python_bindings is not registered"; exit 1; }

      - name: Test
        env:
          FFAUDIO_CHAOS: ${{ matrix.chaos == 'ON' && '1:10:2000' || '' }}
        run: ctest --test-dir build --output-on-failure

      - name: Exported functions (abi/ffaudio.symbols)
        if: matrix.name == 'release'
        run: scripts/dev/check_symbols.sh build/libffaudio.so

      # An application's view: the installed headers from C and C++, through find_package and pkg-config
      - name: Consumer
        if: matrix.name == 'release'
        run: |
          cmake --install build
          cmake -S tests/consumer -B build-consumer -G Ninja -DCMAKE_PREFIX_PATH=$PWD/stage
          cmake --build build-consumer
          LD_LIBRARY_PATH=$PWD/stage/lib build-consumer/consumer_c
          LD_LIBRARY_PATH=$PWD/stage/lib build-consumer/consumer_cpp
          export PKG_CONFIG_PATH=$PWD/stage/lib/pkgconfig
          cc -std=c99 -pedantic -Wall -Werror tests/consumer/consumer.c -o consumer_pc $(pkg-config --cflags --libs ffaudio)
          LD_LIBRARY_PATH=$PWD/stage/lib ./consumer_pc

  windows:
    name: Windows (MSYS2 UCRT64, ${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            chaos: OFF
            experimental: false
          - name: chaos
            chaos: ON
            experimental: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-flac

      # .NET for the C# bindings' tests. The MSYS2 shell does not see the system's PATH, so CMake is told where dotnet is.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The test fixtures are generated with MSYS2's ffmpeg.exe (and metaflac.exe) (bash comes with MSYS2)
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFFAUDIO_SANITIZER=none
          -DFFAUDIO_CHAOS=${{ matrix.chaos }} -DFFAUDIO_REQUIRE_TESTS=ON
          "-DFFAUDIO_DOTNET=C:/Program Files/dotnet/dotnet.exe"

      - name: Build
        run: cmake --build build

      - name: The bindings' tests are there
        run: |
          ctest --test-dir build -N | grep -q csharp_bindings || { echo "::error::csharp_bindings is not registered (no .NET SDK found)"; exit 1; }

      - name: Test
        env:
          FFAUDIO_CHAOS: ${{ matrix.chaos == 'ON' && '1:10:2000' || '' }}
        run: ctest --test-dir build --output-on-failure
