name: CI

on:
  push:
    branches: [ master, dev, stabilize, dual-tracks ]
  pull_request:

jobs:
  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            build_type: RelWithDebInfo
            sanitizer: none
          - name: asan
            build_type: Debug
            sanitizer: address
    steps:
      - uses: actions/checkout@v4

      # The Ubuntu mirror is sometimes very slow (~100 kB/s for the ~107 MB of packages, 15+ minutes),
      # so the downloaded .deb files are cached. The month in the key picks up package updates regularly.
      - name: Cache key
        id: apt-key
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-ubuntu-24.04-${{ steps.apt-key.outputs.month }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-ubuntu-24.04-${{ steps.apt-key.outputs.month }}-
            apt-ubuntu-24.04-

      # cmake and pkg-config come with the runner image
      - name: Install dependencies
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-cache" \
            ninja-build ffmpeg libsdl2-dev \
            libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev libswresample-dev
          # apt leaves root-owned files behind; the cache action needs to read them
          sudo rm -f ~/apt-cache/lock
          sudo chown -R "$USER" ~/apt-cache

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DFFAUDIO_SANITIZER=${{ matrix.sanitizer }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-ffmpeg

      # The test fixtures are generated with MSYS2's ffmpeg.exe (bash comes with MSYS2)
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFFAUDIO_SANITIZER=none

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
